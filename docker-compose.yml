version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospital_db
    ports:
      - "3307:3306"

  backend:
    build: ./backend
    container_name: hospital-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: hospital-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend